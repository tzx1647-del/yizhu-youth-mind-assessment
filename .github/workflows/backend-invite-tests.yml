name: Backend and student A-form checks
on:
  push:
    branches: [dev/online-backend-v1]
  pull_request:
    paths: ['backend/**', 'frontend/**', 'index.html', '.github/workflows/backend-invite-tests.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test backend/invite_core.test.mjs frontend/student-flow-preview.test.mjs backend/edge/assessment-demo/score.test.mjs frontend/online-demo-preview.test.mjs frontend/admin-dashboard-preview.test.mjs frontend/admin-readable-view.test.mjs frontend/admin-evidence.test.mjs frontend/admin-report-draft.test.mjs frontend/admin-report-edit.test.mjs frontend/admin-report-generate.test.mjs frontend/admin-report-review.test.mjs
